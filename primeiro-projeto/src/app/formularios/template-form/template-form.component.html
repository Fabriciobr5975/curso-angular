<form #f="ngForm" (ngSubmit)="onSubmit(f)">
  <div
    class="mb-3"
    [class.has-error]="!nome.valid && nome.touched"
    [class.has-feedback]="!nome.valid && nome.touched"
  >
    <label for="nome" class="form-label">Nome</label>
    <input
      type="text"
      class="form-control"
      id="nome"
      name="nome"
      placeholder="Nome"
      [ngModel]="usuario.nome"
      required
      #nome="ngModel"
    />
    <!-- <div>
      {{ nome.className }}
    </div> -->
    @if (!nome.valid && nome.touched) {
      <div class="alert alert-danger" role="alert">Nome é obrigatório</div>
    }
  </div>

  <div
    class="mb-3"
    [class.has-error]="!email.valid && email.touched"
    [class.has-feedback]="!email.valid && email.touched"
  >
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="nome@email.com"
      [ngModel]="usuario.email"
      required
      email
      #email="ngModel"
    />
    <!-- pattern="^(?!\.)(?!.*\.\.)(?!.*\.@)[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@(?!-)[a-zA-Z0-9-]+(?<!-)(?:\.[a-zA-Z0-9-]+(?<!-))*\.[a-zA-Z]{2,}$" -->
    @if (!email.valid && email.touched) {
      <div class="alert alert-danger" role="alert">Email inválido</div>
    }
  </div>
  <button type="submit" class="btn btn-primary" [disabled]="!f.valid">Submit</button>

  <app-form-debug [form]="f" ></app-form-debug>
</form>
