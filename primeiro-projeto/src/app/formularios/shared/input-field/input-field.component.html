<div class="col-sm-12" [ngClass]="classeCss()">
  <label [attr.for]="id()" class="form-label">{{ label() }}</label>
  <input
    type="text"
    class="form-control"
    [type]="type()"
    [id]="id()"
    [placeholder]="placeholder()"
    [readOnly]="!!isReadOnly()"
    [(ngModel)]="value"
  />
  <app-error-msg [control]="control()" [label]="label()">
  </app-error-msg>
</div>
