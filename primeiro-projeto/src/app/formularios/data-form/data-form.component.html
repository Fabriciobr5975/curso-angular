<form [formGroup]="formulario" (ngSubmit)="onSubmit()">
  <div class="row g-3 pt-3 pb-3">
    <app-input-field
      formControlName="nome"
      type="text"
      [classeCss]="aplicaCssErro('nome')"
      id="nome"
      label="Nome"
      placeholder="Nome"
      [control]="formulario.get('nome')!"
    >
    </app-input-field>

    <!-- <div class="col-sm-12" [ngClass]="aplicaCssErro('nome')">
      <label for="nome" class="form-label">Nome</label>
      <input
        type="text"
        class="form-control"
        id="nome"
        formControlName="nome"
        placeholder="Nome"
      />
      <app-error-msg [control]="formulario.get('nome')" label="Nome">
      </app-error-msg>
    </div> -->
    <div class="col-sm-12" [ngClass]="aplicaCssErro('email')">
      <label for="email" class="form-label">Email</label>
      <input
        type="email"
        class="form-control"
        id="email"
        formControlName="email"
        placeholder="nome@email.com"
      />
      <app-campo-control-erro
        [mostrarErro]="verificaValidTouched('email')"
        msgErro="Email é obrigatório"
      >
      </app-campo-control-erro>
      <app-campo-control-erro
        [mostrarErro]="verificaEmailInvalido()"
        msgErro="Email inválido"
      >
      </app-campo-control-erro>
      <app-campo-control-erro
        [mostrarErro]="formulario.get('email')?.status === 'PENDING'"
        msgErro="Validando Email"
      >
      </app-campo-control-erro>
      <app-campo-control-erro
        [mostrarErro]="formulario.get('email')?.status === 'VALID'"
        msgErro="Email válido!"
      >
      </app-campo-control-erro>
      <app-campo-control-erro
        [mostrarErro]="
          formulario.get('email')?.hasError('emailInvalido') ?? false
        "
        msgErro="Email já cadastrado!"
      >
      </app-campo-control-erro>
    </div>

    <div class="col-sm-12" [ngClass]="aplicaCssErro('email')">
      <label for="confirmarEmail" class="form-label">Confirmar Email</label>
      <input
        type="email"
        class="form-control"
        id="confirmarEmail"
        formControlName="confirmarEmail"
        placeholder="nome@email.com"
      />
      <app-campo-control-erro
        [mostrarErro]="
          formulario.get('confirmarEmail')?.hasError('equalsTo') ?? false
        "
        msgErro="Emails não são iguais"
      >
      </app-campo-control-erro>
    </div>

    <div formGroupName="endereco" class="row g-3">
      <div class="col-md-3" [ngClass]="aplicaCssErro('endereco.cep')">
        <label for="cep" class="form-label">CEP</label>
        <input
          type="text"
          class="form-control"
          id="cep"
          placeholder="00000-000"
          formControlName="cep"
        />
        <app-error-msg [control]="formulario.get('endereco.cep')" label="CEP">
        </app-error-msg>
        <!--   <app-campo-control-erro
          [mostrarErro]="verificaValidTouched('endereco.cep')"
          msgErro="CEP é obrigatório"
        >
        </app-campo-control-erro>
        <app-campo-control-erro
          [mostrarErro]="verificarCepInvalido()"
          msgErro="CEP inválido"
        >
        </app-campo-control-erro> -->
      </div>

      <div class="col-md-3" [ngClass]="aplicaCssErro('endereco.numero')">
        <label for="numero" class="form-label">Número</label>
        <input
          type="text"
          class="form-control"
          id="numero"
          formControlName="numero"
        />
        <app-campo-control-erro
          [mostrarErro]="verificaValidTouched('endereco.numero')"
          msgErro="Número é obrigatório"
        ></app-campo-control-erro>
      </div>

      <div class="col-md-6">
        <label for="complemento" class="form-label">Complemento</label>
        <input
          type="text"
          class="form-control"
          id="complemento"
          formControlName="complemento"
        />
      </div>

      <div class="col-sm-12" [ngClass]="aplicaCssErro('endereco.rua')">
        <label for="rua" class="form-label">Rua</label>
        <input
          type="text"
          class="form-control"
          id="rua"
          formControlName="rua"
        />
        <app-campo-control-erro
          [mostrarErro]="verificaValidTouched('endereco.rua')"
          msgErro="Rua é obrigatório"
        ></app-campo-control-erro>
      </div>

      <div class="col-md-5" [ngClass]="aplicaCssErro('endereco.bairro')">
        <label for="bairro" class="form-label">Bairro</label>
        <input
          type="text"
          class="form-control"
          id="bairro"
          formControlName="bairro"
        />
        <app-campo-control-erro
          [mostrarErro]="verificaValidTouched('endereco.bairro')"
          msgErro="Bairro é obrigatório"
        ></app-campo-control-erro>
      </div>

      <div class="col-md-4" [ngClass]="aplicaCssErro('endereco.cidade')">
        <label for="cidade" class="form-label">Cidade</label>
        <select
          type="text"
          class="form-select"
          id="cidade"
          formControlName="cidade"
        >
          @for (cidade of cidades; track cidade.id) {
            <option [value]="cidade.nome">
              {{ cidade.nome }}
            </option>
          }
        </select>
        <app-campo-control-erro
          [mostrarErro]="verificaValidTouched('endereco.cidade')"
          msgErro="Cidade é obrigatório"
        ></app-campo-control-erro>
      </div>

      <!-- <div class="col-md-4" [ngClass]="aplicaCssErro('endereco.cidade')">
        <label for="cidade" class="form-label">Cidade</label>
        <input
          type="text"
          class="form-control"
          id="cidade"
          formControlName="cidade"
        />
        <app-campo-control-erro
          [mostrarErro]="verificaValidTouched('endereco.cidade')"
          msgErro="Cidade é obrigatório"
        ></app-campo-control-erro>
      </div> -->

      <div class="col-md-3" [ngClass]="aplicaCssErro('endereco.estado')">
        <label for="estado" class="form-label">Estado</label>
        <select
          type="text"
          class="form-select"
          id="estado"
          formControlName="estado"
        >
          <!-- @for (estado of (estados | async) ?? []; track estado.id) { -->
          @for (estado of estados; track estado.id) {
            <option [value]="estado.sigla">
              {{ estado.nome }}
            </option>
          }
          <!-- <option
            *ngFor="let estado of (estados | async) ?? []"
            [value]="estado.sigla"
          >
            {{ estado.nome }}
          </option> -->
        </select>
        <!-- [mostrarErro]="formulario.controls['endereco.estado'].valid"  -->
        <!-- [mostrarErro]="formulario.get('endereco.estado')?.valid"  -->
        <app-campo-control-erro
          [mostrarErro]="verificaValidTouched('endereco.estado')"
          msgErro="Estado é obrigatório"
        ></app-campo-control-erro>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-3" [ngClass]="aplicaCssErro('cargo')">
        <label for="cargo" class="form-label">Cargo</label>
        <select
          class="form-select"
          id="cargo"
          formControlName="cargo"
          [compareWith]="compararCargos"
        >
          @for (cargo of cargos; track $index) {
            <option [ngValue]="cargo">
              {{ cargo.desc }}
            </option>
          }
        </select>
      </div>

      <div class="col-md-3" [ngClass]="aplicaCssErro('tecnologia')">
        <label for="tecnologias" class="form-label">Tecnologias</label>
        <select
          class="form-select"
          id="tecnologias"
          formControlName="tecnologias"
          multiple
        >
          @for (tecnologia of tecnologias; track $index) {
            <option [value]="tecnologia.nome">
              {{ tecnologia.desc }}
            </option>
          }
        </select>
      </div>

      <div class="col-md-3" [ngClass]="aplicaCssErro('newsletter')">
        <div>
          <label for="newsletter" class="form-label">Newsletter</label>
        </div>
        <div id="newletter" class="row form-check form-check-inline">
          @for (item of newsletterOp; track $index) {
            <div class="col-sm-4">
              <label class="form-check-label">
                <input
                  type="radio"
                  class="form-check-input"
                  formControlName="newsletter"
                  [value]="item.valor"
                />
                {{ item.desc }}
              </label>
            </div>
          }
        </div>
      </div>

      <div class="col-md-3" [ngClass]="aplicaCssErro('termos')">
        <div class="form-check form-check-inline">
          <label class="form-check-label">
            <input
              type="checkbox"
              class="form-check-input"
              formControlName="termos"
            />
          </label>
          Aceito os termos.
        </div>
        <app-campo-control-erro
          [mostrarErro]="!formulario.get('termos')?.valid"
          msgErro="Por favor, aceite os termos!"
        ></app-campo-control-erro>
      </div>

      <div class="col-md-3" [ngClass]="aplicaCssErro('frameworks')">
        <div>
          <label for="frameworks" class="form-label">Frameworks</label>
        </div>
        <div id="frameworks" class="form-check form-check-inline">
          @for (item of formulario.get("frameworks")?.value; track $index) {
            <div class="col-sm-3" formArrayName="frameworks">
              <label class="form-check-label">
                <input
                  type="checkbox"
                  class="form-check-input"
                  [formControlName]="$index"
                />
                {{ frameworks[$index] }}
              </label>
            </div>
          }
          <app-campo-control-erro
            [mostrarErro]="!formulario.get('frameworks')?.valid"
            msgErro="Selecione uma opção!"
          ></app-campo-control-erro>
        </div>
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
  <button class="btn btn-secondary" (click)="resetar()">Cancelar</button>
  <button class="btn btn-info" (click)="setarCargo()">Cargo</button>
  <button class="btn btn-info" (click)="setarTecnologia()">Tecnologia</button>

  <app-form-debug [form]="formulario"></app-form-debug>
</form>
