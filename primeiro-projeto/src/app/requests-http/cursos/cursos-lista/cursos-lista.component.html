<div class="card mt-3">
  <div class="card-header">
    <div class="float-start">
      <h4>Cursos</h4>
    </div>
    <div class="float-end">
      <button type="button" class="btn btn-primary" [routerLink]="['novo']">
        Novo Curso
      </button>
      <button type="button" class="btn btn-secondary" (click)="onRefresh()">Atualizar</button>
    </div>
  </div>
  <div class="card-body">
    @if (cursos$ | async; as cursos) {
      <!-- <table class="table table-hover" *ngIf="cursos$ | async as cursos; else loading"> -->
      <table class="table table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>Curso</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (curso of cursos; track curso.id) {
            <tr>
              <td>{{ curso.id }}</td>
              <td>{{ curso.nome }}</td>
              <td>
                <span class="float-end">
                  <button class="btn btn-outline-warning mb-1 btn-sm" (click)="onEdit(curso.id)">
                    Atualizar
                  </button>

                  <button class="btn btn-outline-danger mb-1 btn-sm" (click)="onRemove(curso)">
                    Remover
                  </button>
                </span>
              </td>
            </tr>
          }
        </tbody>
      </table>
    } @else {
      <span>Carregando Cursos...</span>
      <!-- @if (error$ | async) {
        <div>Erro ao carregar cursos. Tente novamente mais tarde.</div>
      } @else {
        <span>Carregando Cursos...</span>
      } -->
    }

    <!-- <ng-template #loading>
      <div *ngIf="error$ | async; else loadingNoError">
        Erro ao carregar cursos. Tente novamente mais tarde.
      </div>
      <ng-template #loadingNoError>
        <span>Carregando Cursos...</span>
      </ng-template>
    </ng-template> -->
  </div>

  <ng-template #deleteModal>
    <div class="modal-body text-center">
      <p>Tem certeza que deseja remover esse curso?</p>
      <button type="button" class="btn btn-default" (click)="onConfirmDelete()">Sim</button>
      <button type="button" class="btn btn-primary" (click)="onDeclineDelete()">Nao</button>
    </div>
  </ng-template>
</div>
