<h5>Criar/Editar Aluno</h5>

<div class="row">
  <div class="form-group">
    <label for="disabled">#</label>
    <input
      disabled
      [(ngModel)]="aluno.id"
      type="text"
      class="form-control"
      id="disabled"
    />
  </div>

  <div class="form-group">
    <label for="nome">Nome</label>
    <input
      [(ngModel)]="aluno.nome"
      type="text"
      class="form-control"
      id="nome"
    />
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input
      [(ngModel)]="aluno.email"
      type="email"
      class="form-control"
      id="email"
    />
  </div>
</div>
