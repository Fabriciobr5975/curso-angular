<h5>Login</h5>

<div class="row">
  <div class="form-group">
    <label for="usuario">Usuário</label>
    <input type="text" class="form-control" id="usuario" [(ngModel)]="usuario.nome" />
  </div>

  <div class="form-group mt-2">
    <label for="senha">Senha</label>
    <input type="password" class="form-control" id="senha" [(ngModel)]="usuario.senha" />
  </div>
</div>

<button class="btn btn-primary mt-4" (click)="fazerLogin()">Login</button>
